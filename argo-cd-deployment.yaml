apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: greensboro-weather-app
  namespace: argocd 
spec:
  destination: 
    namespace: gitops-kubernetes
    server: https://kubernetes.default.svc 
  project: default 
  source:
    repoURL: https://github.com/Christopher-Tetteh-Nenebi/gitops-k8s-greensboro-weather-app.git
    path: deployment
    targetRevision: main